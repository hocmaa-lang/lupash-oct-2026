*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);

label{display:block;font-size:13px;font-weight:600;
 color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;font-size:15px;font-family:var(--sans);color:var(--ink);
 background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:16px}
input:focus{outline:2px solid var(--s1);outline-offset:1px}

 background:var(--s1);color:#fff;border:none;border-radius:4px}
button:disabled{opacity:.55;cursor:progress}
.err{color:var(--crit);font-size:14px;min-height:20px;margin-top:12px}
#u{direction:ltr;text-align:left}#p{direction:ltr;text-align:left}
