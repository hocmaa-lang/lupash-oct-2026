<style>
:root{--paper:#F4F6F9;--panel:#FFFFFF;--ink:#141A2C;--muted:#5A6378;--rule:#DCE1EA;--s1:#22389A;--crit:#B3261E;--gold:#9A7428;

@media(prefers-color-scheme:dark){:root{--paper:#0D111D;--panel:#151B2B;--ink:#E6E9F1;--muted:#9AA3B8;

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
 font-family:var(--sans);padding:24px}
.gate{width:100%;max-width:380px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin:0 0 10px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:700}
p.sub{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;
 color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;font-size:15px;font-family:var(--sans);color:var(--ink);
 background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:16px}
input:focus{outline:2px solid var(--s1);outline-offset:1px}
button{width:100%;padding:12px;font-size:15px;font-weight:650;font-family:var(--sans);cursor:pointer;
 background:var(--s1);color:#fff;border:none;border-radius:4px}
button:disabled{opacity:.55;cursor:progress}
.err{color:var(--crit);font-size:14px;min-height:20px;margin-top:12px}
#u{direction:ltr;text-align:left}#p{direction:ltr;text-align:left}
</style></head><body>
